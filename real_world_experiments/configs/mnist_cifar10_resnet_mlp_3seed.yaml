defaults:
  - data: cifar10_orbit
  - model: resnet20_gn
  - graph: blown_up_path
  - condition: main
  - pilot: default
  - analysis: default
  - _self_

experiment:
  name: mnist_cifar10_resnet_mlp_3seed
output_root: outputs_mnist_cifar10_resnet_mlp_3seed
report_root: reports_mnist_cifar10_resnet_mlp_3seed
project_root: .
manifest_root: real_world_experiments/data/manifests/mnist_cifar10_resnet_mlp_3seed
device: auto
deterministic: true
seed: 1
stage: final
resume: false

training:
  epochs: 200
  batch_size_per_node: 128
  learning_rate: 0.05
  momentum: 0.0
  weight_decay: 0.0
  warmup_epochs: 5
  minimum_learning_rate: 0.0005
  communication_every_steps: 1
  diagnostics_every_steps: 100
  graph_penalty_every_epochs: 1
  label_smoothing: 0.0
  gradient_clipping: null
  mixed_precision: false
  eval_every_epochs: 5
  checkpoint_every_epochs: 5
  num_workers: 1
  persistent_workers: true
  terminal_window_checkpoints: 5
  decomposition_tolerance: 1.0e-9
  ratio_threshold: 1.0e-14

artifacts:
  save_final_logits: false

# Observation-only profile for newly started Main/final runs. Existing run
# profiles are frozen on resume. Epoch 175 is not part of the terminal average.
orbit_diagnostics:
  enabled: true
  schema_version: 1

final:
  datasets: [mnist, cifar10]
  models: [resnet20_gn, mlp_ln]
  conditions: [main, no_communication, misaligned_data, fully_symmetric]
  seeds: [1, 2, 3]

legacy_reuse:
  enabled: true
  source_root: null
  allowed_dataset: cifar10
  allowed_model: resnet20_gn
  seeds: [1, 2, 3]
  conditions: [main, no_communication, misaligned_data, fully_symmetric]
  mode: copy_analysis_artifacts
  on_missing: block
  on_incompatible: block
  allow_retrain: false
  retrain_overrides: []
  rerun_pilot_family: false

preflight:
  seed: 0
  training:
    epochs: 1
    warmup_epochs: 0
    eval_every_epochs: 1
    checkpoint_every_epochs: 1
    terminal_window_checkpoints: 1
    num_workers: 0
    persistent_workers: false
